# 프로덕션 환경 설정
spring:
  application:
    name: url-shortener
  datasource:
    # H2 데이터베이스 사용 (TCP 모드로 외부 접근 가능)
    url: jdbc:h2:tcp://localhost:9092/./data/url_shortener;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC\;SET SCHEMA PUBLIC
    driver-class-name: org.h2.Driver
    username: sa
    password: ${H2_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true  # 외부 접근 허용
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

app:
  base-url: ${APP_BASE_URL:http://223.130.157.227:8080}
  jwt:
    secret: ${JWT_SECRET:hlink-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-security-change-this-in-production}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hlink.urlshortener.model
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  level:
    com.hlink.urlshortener: INFO
    org.springframework.web: WARN
    org.mybatis: WARN
    root: INFO
  file:
    name: /opt/url-shortener/logs/application.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

