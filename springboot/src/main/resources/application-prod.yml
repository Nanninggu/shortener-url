# 프로덕션 환경 설정
spring:
  application:
    name: url-shortener
  datasource:
    # H2 데이터베이스 사용 (Embedded 모드)
    url: jdbc:h2:file:/opt/url-shortener/data/url_shortener;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC\;SET SCHEMA PUBLIC
    driver-class-name: org.h2.Driver
    username: sa
    password: ${H2_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true  # 외부 접근 허용
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

app:
  base-url: ${APP_BASE_URL:http://223.130.157.227}
  jwt:
    secret: ${JWT_SECRET:hlink-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-security-change-this-in-production}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hlink.urlshortener.model
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  level:
    com.hlink.urlshortener: INFO
    org.springframework.web: WARN
    org.mybatis: WARN
    root: INFO
  file:
    name: /opt/url-shortener/logs/application.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Swagger/OpenAPI 설정 (프로덕션)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: true
    # 리다이렉트 루프 방지: 기본 경로 사용 (root-path 제거)
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    # 기본 예제 비활성화 (Petstore 제거) - 강제 적용
    disable-swagger-default-url: true
    try-it-out-enabled: true
    filter: true
    # 현재 애플리케이션 API만 표시 (Petstore 완전 제거)
    urls:
      - url: /v3/api-docs
        name: H-Link URL Shortener API
    urls-primary-name: H-Link URL Shortener API
    # 기본 예제 URL 완전 제거
    default-url: /v3/api-docs
  packages-to-scan: com.hlink.urlshortener.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

