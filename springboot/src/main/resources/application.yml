spring:
  application:
    name: url-shortener
  datasource:
    # H2 데이터베이스 사용 (Embedded 모드)
    url: jdbc:h2:file:./data/url_shortener;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC\;SET SCHEMA PUBLIC
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true  # 외부 접근 허용
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/schema-h2.sql
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  base-url: http://localhost:8080
  jwt:
    secret: hlink-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-security

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hlink.urlshortener.model
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  level:
    com.hlink.urlshortener: DEBUG
    org.springframework.web: INFO
    org.mybatis: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    # 커스텀 CSS 적용 (shadcn 스타일)
    config-url: /v3/api-docs/swagger-config
    # 기본 예제 비활성화 (Petstore 제거)
    disable-swagger-default-url: true
    # 기본 URL 제거
    try-it-out-enabled: true
    filter: true
    # 현재 애플리케이션 API만 표시
    urls:
      - url: /v3/api-docs
        name: H-Link URL Shortener API
    # 기본 URL 목록 비활성화
    urls-primary-name: H-Link URL Shortener API
  # 패키지 스캔 경로 명시
  packages-to-scan: com.hlink.urlshortener.controller
  # 기본 예제 비활성화
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

