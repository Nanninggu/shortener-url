spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: ${DB_USERNAME:${USER}}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  base-url: http://localhost:8080
  jwt:
    secret: hlink-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-security

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hlink.urlshortener.model
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

logging:
  level:
    com.hlink.urlshortener: DEBUG
    org.springframework.web: INFO
    org.mybatis: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

