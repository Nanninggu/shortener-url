# 개발 환경용 설정 (H2 데이터베이스 - TCP 모드로 외부 접근 가능)
spring:
  datasource:
    # H2 데이터베이스 사용 (TCP 모드로 외부 접근 가능)
    url: jdbc:h2:tcp://localhost:9092/./data/url_shortener;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC\;SET SCHEMA PUBLIC
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true  # 외부 접근 허용
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql

