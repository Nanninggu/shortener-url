# Nginx 설정 파일
# /etc/nginx/sites-available/url-shortener

# HTTP 서버 (80 포트)
server {
    listen 80;
    server_name 223.130.157.227;

    # 프론트엔드 정적 파일 서빙
    root /opt/url-shortener/vue/dist;
    index index.html;

    # ===== Swagger UI 및 API 관련 경로 (location / 보다 먼저 처리) =====
    
    # 정적 파일 캐싱 (정확한 경로만 매칭)
    # Vue 프론트엔드 정적 파일 (root 디렉토리에서)
    location ~* ^/(?!api|swagger-ui|webjars|v3|swagger-resources|h2-console).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 프론트엔드 정적 파일
    }
    
    # swagger-ui.html 직접 접근 (리디렉션 루프 방지)
    location = /swagger-ui.html {
        proxy_pass http://localhost:8080/swagger-ui/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # Swagger UI 정적 리소스 (index.html 내 CSS/JS 요청) - Spring Boot를 통해 제공
    # 모든 /swagger-ui 요청을 Spring Boot로 전달 (경로 유지)
    location /swagger-ui/ {
        proxy_pass http://localhost:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # API 문서 (OpenAPI JSON) - v3/api-docs
    location ~ ^/v3/api-docs {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Swagger 리소스
    location /swagger-resources {
        proxy_pass http://localhost:8080/swagger-resources;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # WebJars (Swagger UI 정적 리소스)
    location /webjars/ {
        proxy_pass http://localhost:8080/webjars/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 백엔드 API 프록시 (/api 경로)
    location /api {
        proxy_pass http://localhost:8080/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # H2 콘솔 (외부 접근 가능)
    location /h2-console {
        proxy_pass http://localhost:8080/h2-console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 리다이렉트 엔드포인트 (단축 URL) - 정규식은 API 경로가 아닌 것만
    location ~ ^/[a-zA-Z0-9]+$ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프론트엔드 라우팅 (Vue Router) - 마지막 위치
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 로그
    access_log /var/log/nginx/url-shortener-access.log;
    error_log /var/log/nginx/url-shortener-error.log;
}

