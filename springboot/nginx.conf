# Nginx 설정 파일
# /etc/nginx/sites-available/url-shortener

# HTTP 서버 (80 포트)
server {
    listen 80;
    server_name 223.130.157.227;

    # 프론트엔드 정적 파일 서빙
    root /opt/url-shortener/vue/dist;
    index index.html;

    # ===== Swagger UI 및 API 관련 경로 (location / 보다 먼저 처리) =====
    
    # Swagger UI 리소스 경로 중복 문제 해결
    # /swagger-ui/swagger-ui/ 경로를 /swagger-ui/로 리다이렉트 (무한 리다이렉트 루프 방지)
    location ~ ^/swagger-ui/swagger-ui(/.*)?$ {
        return 301 /swagger-ui$1;
    }

    # Swagger UI 프록시 - Spring Boot의 리다이렉트를 완전히 무시
    # Spring Boot는 /swagger-ui/index.html만 제공하며, 이를 요청하면 /swagger-ui/로 리다이렉트
    # nginx에서 모든 요청을 /swagger-ui/index.html로 직접 프록시하여 루프 방지
    
    # /swagger-ui/index.html - 직접 프록시 (가장 구체적인 경로 우선)
    location = /swagger-ui/index.html {
        proxy_pass http://localhost:8080/swagger-ui/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Spring Boot의 리다이렉트를 완전히 무시
        proxy_intercept_errors off;
    }
    
    # /swagger-ui/ (trailing slash 있음) -> /swagger-ui/index.html로 직접 프록시
    # Spring Boot의 리다이렉트를 우회하여 직접 index.html로 프록시
    location = /swagger-ui/ {
        proxy_pass http://localhost:8080/swagger-ui/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_intercept_errors off;
    }
    
    # /swagger-ui (trailing slash 없음) -> /swagger-ui/index.html로 리다이렉트
    location = /swagger-ui {
        return 301 /swagger-ui/index.html;
    }
    
    # /swagger-ui/* (기타 리소스: CSS, JS 등) -> Spring Boot로 프록시
    location ~ ^/swagger-ui/(.+)$ {
        proxy_pass http://localhost:8080/swagger-ui/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # API 문서 (OpenAPI JSON)
    location /v3/api-docs {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Swagger 리소스
    location /swagger-resources {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # WebJars (Swagger UI 정적 리소스)
    location /webjars {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Swagger UI를 /api 경로로 접근할 수 있도록 프록시 (더 구체적인 경로를 먼저 처리)
    location /api/swagger-ui {
        rewrite ^/api/swagger-ui(.*)$ /swagger-ui$1 break;
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # API 문서를 /api 경로로 접근할 수 있도록 프록시
    location /api/v3/api-docs {
        rewrite ^/api/v3/api-docs(.*)$ /v3/api-docs$1 break;
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Swagger 리소스를 /api 경로로 접근할 수 있도록 프록시
    location /api/swagger-resources {
        rewrite ^/api/swagger-resources(.*)$ /swagger-resources$1 break;
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # WebJars를 /api 경로로 접근할 수 있도록 프록시
    location /api/webjars {
        rewrite ^/api/webjars(.*)$ /webjars$1 break;
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 백엔드 API 프록시
    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 프론트엔드 라우팅 (Vue Router) - Swagger UI 경로 제외
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 리다이렉트 엔드포인트 (단축 URL)
    location ~ ^/[a-zA-Z0-9]+$ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # QR 코드 이미지
    location /api/qrcode {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # H2 콘솔 (외부 접근 가능)
    location /h2-console {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 정적 파일 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 로그
    access_log /var/log/nginx/url-shortener-access.log;
    error_log /var/log/nginx/url-shortener-error.log;
}

